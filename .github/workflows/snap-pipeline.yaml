name: Snap CI/CD Pipeline
on:
  push:
    branches: [main]
    paths:
      - 'snap/snapcraft.yaml'
      - 'un-seal'
  pull_request:
    branches: [main]
    paths:
      - 'snap/snapcraft.yaml'
      - 'un-seal'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Snap Version
        run: |
          VERSION=$(grep -E '^version:' snap/snapcraft.yaml | awk '{print $2}' | tr -d "'\"")
          echo "SNAP_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Verify Version Consistency
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Extract version from the un-seal script header (matches "# version: X.X.X")
          SCRIPT_VERSION=$(grep -m1 "^# version:" un-seal | awk '{print $3}')
          
          if [ -z "$SCRIPT_VERSION" ]; then
            echo "Error: Could not find '# version: X.X.X' in the un-seal script."
            exit 1
          fi
          
          echo "Snapcraft Version: ${{ env.SNAP_VERSION }}"
          echo "Script Version: $SCRIPT_VERSION"
          
          if [ "${{ env.SNAP_VERSION }}" != "$SCRIPT_VERSION" ]; then
            echo "Error: Version mismatch! snapcraft.yaml (${{ env.SNAP_VERSION }}) vs un-seal script ($SCRIPT_VERSION)"
            exit 1
          fi
          
          # 2. Get the latest release from GitHub (defaults to 0.0.0 if no releases exist)
          LATEST_TAG=$(gh release view --json tagName -q ".tagName" 2>/dev/null || echo "v0.0.0")
          LATEST_VERSION=${LATEST_TAG#v}
          
          echo "Latest GitHub Release: $LATEST_VERSION"
          
          # 3. Check if current version is strictly greater than the latest release
          if dpkg --compare-versions "${{ env.SNAP_VERSION }}" le "$LATEST_VERSION"; then
            echo "Error: Current version (${{ env.SNAP_VERSION }}) is not newer than the latest release ($LATEST_VERSION)."
            echo "Did you forget to bump the version?"
            exit 1
          fi
          
          echo "Version check passed!"

      - name: Build snap
        uses: snapcore/action-build@v1
        id: snapcraft

      - name: Install snap
        run: |
          sudo snap install --dangerous ${{ steps.snapcraft.outputs.snap }}

      - name: Run snap (Functional test - Help Output)
        run: |
          un-seal --help

      - name: Upload snap artifact
        uses: actions/upload-artifact@v4
        with:
          name: un-seal_${{ env.SNAP_VERSION }}
          path: ${{ steps.snapcraft.outputs.snap }}

      - name: Upload snapcraft logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: snapcraft-logs_${{ env.SNAP_VERSION }}
          path: /home/runner/.cache/snapcraft/log/*.log

  publish_edge:
    needs: build_and_test
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Snap Version
        run: |
          VERSION=$(grep -E '^version:' snap/snapcraft.yaml | awk '{print $2}' | tr -d "'\"")
          echo "SNAP_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Download Built Snap Artifact
        uses: actions/download-artifact@v4
        with:
          name: un-seal_${{ env.SNAP_VERSION }}

      - name: Find Downloaded Snap File
        run: |
          # Specifically look for a .snap file matching the current version
          # e.g., un-seal_6.0.3_amd64.snap
          SNAP_FILE=$(ls *_${{ env.SNAP_VERSION }}_*.snap | head -n 1)
          
          if [ -z "$SNAP_FILE" ]; then
            echo "Error: Could not find the downloaded .snap file matching version ${{ env.SNAP_VERSION }}."
            exit 1
          fi
          
          echo "Found snap file: $SNAP_FILE"
          echo "SNAP_FILE=$SNAP_FILE" >> $GITHUB_ENV

      - name: Publish to Snap Store (Edge Channel)
        uses: canonical/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.STORE_LOGIN }}
        with:
          snap: ${{ env.SNAP_FILE }}
          release: edge
